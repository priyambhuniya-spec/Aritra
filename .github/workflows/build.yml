name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Assemble project
        run: |
          mkdir -p proj/app/src/main/java/com/moonlens proj/app/src/main/res/layout proj/app/src/main/res/drawable proj/app/src/main/res/values proj/app/src/main/assets
          cp MainActivity.kt MoonProcessor.kt MoonEnhancer.kt MoonRelightV2.kt MoonNeural.kt CraterFusion.kt proj/app/src/main/java/com/moonlens/
          cp moon_ref*.jpg proj/app/src/main/assets/ 2>/dev/null || true
          cp moon_dem*.* moon_albedo*.* moon_enhancer.tflite proj/app/src/main/assets/ 2>/dev/null || true
          echo 'android.useAndroidX=true' > proj/gradle.properties
          echo 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }' > proj/settings.gradle.kts
          echo 'dependencyResolutionManagement { repositories { google(); mavenCentral() } }' >> proj/settings.gradle.kts
          echo 'rootProject.name = "MoonLens"' >> proj/settings.gradle.kts
          echo 'include(":app")' >> proj/settings.gradle.kts
          echo 'plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }' > proj/build.gradle.kts
          cat > proj/app/build.gradle.kts <<'GRADLE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.moonlens"
              compileSdk = 34
              defaultConfig { applicationId = "com.moonlens"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              implementation("org.tensorflow:tensorflow-lite:2.14.0")
          }
          GRADLE
          cat > proj/app/src/main/res/layout/activity_main.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#000000">

              <androidx.camera.view.PreviewView
                  android:id="@+id/previewView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

              <!-- চাঁদ এই বৃত্তের ভেতরে রাখুন -->
              <View
                  android:id="@+id/moonGuide"
                  android:layout_width="240dp"
                  android:layout_height="240dp"
                  android:layout_gravity="center_horizontal|top"
                  android:layout_marginTop="110dp"
                  android:background="@drawable/bg_moon_guide" />

              <LinearLayout
                  android:id="@+id/panel"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_gravity="bottom"
                  android:background="@drawable/bg_panel"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:id="@+id/statusTv"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:background="@drawable/bg_chip"
                      android:paddingHorizontal="14dp"
                      android:paddingVertical="8dp"
                      android:text="চাঁদ বৃত্তের ভেতরে রাখুন, ট্রাইপড ব্যবহার করুন"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="14dp"
                      android:orientation="horizontal">
                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="শার্পনেস"
                          android:textColor="#B8C0CC"
                          android:textSize="13sp" />
                      <TextView
                          android:id="@+id/sharpVal"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="100%"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp" />
                  </LinearLayout>
                  <SeekBar
                      android:id="@+id/sharpBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="50"
                      android:progressTint="#FFD36B"
                      android:thumbTint="#FFD36B" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="AI গর্ত (০ = Real Mode, নকল গর্ত নেই)"
                          android:textColor="#B8C0CC"
                          android:textSize="13sp" />
                      <TextView
                          android:id="@+id/craterVal"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="80%"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp" />
                  </LinearLayout>
                  <SeekBar
                      android:id="@+id/craterBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="80"
                      android:progressTint="#7FD1FF"
                      android:thumbTint="#7FD1FF" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">
                      <TextView
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="শাটার (ঝলসে গেলে ডানে নিন)"
                          android:textColor="#B8C0CC"
                          android:textSize="13sp" />
                      <TextView
                          android:id="@+id/expVal"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="1/4000"
                          android:textColor="#FFFFFF"
                          android:textSize="13sp" />
                  </LinearLayout>
                  <SeekBar
                      android:id="@+id/expBar"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="100"
                      android:progress="75"
                      android:progressTint="#FFFFFF"
                      android:thumbTint="#FFFFFF" />

                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp">
                      <View
                          android:id="@+id/shutterBtn"
                          android:layout_width="76dp"
                          android:layout_height="76dp"
                          android:layout_gravity="center_horizontal"
                          android:background="@drawable/bg_shutter"
                          android:clickable="true"
                          android:focusable="true" />
                      <ProgressBar
                          android:id="@+id/progress"
                          android:layout_width="36dp"
                          android:layout_height="36dp"
                          android:layout_gravity="center"
                          android:indeterminateTint="#222222"
                          android:visibility="gone" />
                  </FrameLayout>
              </LinearLayout>

              <!-- ফলাফল: ছবি ধরে রাখলে "আগের" ছবি দেখাবে -->
              <FrameLayout
                  android:id="@+id/resultLayer"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:background="#000000"
                  android:visibility="gone">
                  <ImageView
                      android:id="@+id/resultImg"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="fitCenter" />
                  <TextView
                      android:id="@+id/closeBtn"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="top|end"
                      android:layout_margin="20dp"
                      android:background="@drawable/bg_chip"
                      android:paddingHorizontal="16dp"
                      android:paddingVertical="10dp"
                      android:text="✕ ফিরুন"
                      android:textColor="#FFFFFF"
                      android:textSize="14sp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|center_horizontal"
                      android:layout_marginBottom="36dp"
                      android:background="@drawable/bg_chip"
                      android:paddingHorizontal="14dp"
                      android:paddingVertical="8dp"
                      android:text="ছবি ধরে রাখুন = আগের ছবি দেখুন"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp" />
              </FrameLayout>
          </FrameLayout>
          XMLEOF
          cat > proj/app/src/main/res/drawable/bg_panel.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#E6101418" />
              <corners
                  android:topLeftRadius="28dp"
                  android:topRightRadius="28dp" />
          </shape>
          XMLEOF
          cat > proj/app/src/main/res/drawable/bg_chip.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#33FFFFFF" />
              <stroke android:width="1dp" android:color="#55FFFFFF" />
              <corners android:radius="20dp" />
          </shape>
          XMLEOF
          cat > proj/app/src/main/res/drawable/bg_shutter.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <selector xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:state_enabled="false">
                  <layer-list>
                      <item>
                          <shape android:shape="oval">
                              <stroke android:width="4dp" android:color="#66FFFFFF" />
                          </shape>
                      </item>
                      <item android:bottom="9dp" android:left="9dp" android:right="9dp" android:top="9dp">
                          <shape android:shape="oval">
                              <solid android:color="#99FFFFFF" />
                          </shape>
                      </item>
                  </layer-list>
              </item>
              <item android:state_pressed="true">
                  <layer-list>
                      <item>
                          <shape android:shape="oval">
                              <stroke android:width="4dp" android:color="#FFFFFF" />
                          </shape>
                      </item>
                      <item android:bottom="12dp" android:left="12dp" android:right="12dp" android:top="12dp">
                          <shape android:shape="oval">
                              <solid android:color="#CCCCCC" />
                          </shape>
                      </item>
                  </layer-list>
              </item>
              <item>
                  <layer-list>
                      <item>
                          <shape android:shape="oval">
                              <stroke android:width="4dp" android:color="#FFFFFF" />
                          </shape>
                      </item>
                      <item android:bottom="9dp" android:left="9dp" android:right="9dp" android:top="9dp">
                          <shape android:shape="oval">
                              <solid android:color="#FFFFFF" />
                          </shape>
                      </item>
                  </layer-list>
              </item>
          </selector>
          XMLEOF
          cat > proj/app/src/main/res/drawable/bg_moon_guide.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <stroke
                  android:width="2dp"
                  android:color="#99FFFFFF"
                  android:dashWidth="10dp"
                  android:dashGap="8dp" />
          </shape>
          XMLEOF
          cat > proj/app/src/main/res/values/themes.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MoonLens" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          XMLEOF
          cat > proj/app/src/main/AndroidManifest.xml <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="true" />

              <application
                  android:allowBackup="true"
                  android:largeHeap="true"
                  android:label="MoonLens"
                  android:theme="@style/Theme.MoonLens">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XMLEOF
      - run: cd proj && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: MoonLens-apk, path: proj/app/build/outputs/apk/debug/app-debug.apk }
